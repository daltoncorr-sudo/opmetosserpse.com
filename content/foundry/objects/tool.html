<!-- {"bob": [7.8, -5]} -->
<!-- A tool: a 140 px block, tumbling -->
<div class="fd-obj fd-tumble" style="width:140px;height:140px;--dur:22s">
<div class="fd-face fd-ph-face" style="width:140px;height:140px;background:var(--paper-deep);border:1px solid #CFC9BD;transform:translateZ(70px);color:var(--graphite)">[Tool]</div>
<div class="fd-face" style="width:140px;height:140px;background:#E6E4DD;border:1px solid #CFC9BD;transform:rotateY(180deg) translateZ(70px)"></div>
<div class="fd-face" style="width:140px;height:140px;background:#E2DFD7;border:1px solid #CFC9BD;transform:rotateY(90deg) translateZ(70px)"></div>
<div class="fd-face" style="width:140px;height:140px;background:#E2DFD7;border:1px solid #CFC9BD;transform:rotateY(-90deg) translateZ(70px)"></div>
<div class="fd-face" style="width:140px;height:140px;background:#F4F3EF;border:1px solid #CFC9BD;transform:rotateX(90deg) translateZ(70px)"></div>
<div class="fd-face" style="width:140px;height:140px;background:#D9D5CB;border:1px solid #CFC9BD;transform:rotateX(-90deg) translateZ(70px)"></div>
</div>
